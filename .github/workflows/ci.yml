name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '*.slnx'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.github/workflows/ci.yml'
            installer:
              - 'setup/**'
              - '.github/workflows/ci.yml'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install WinFsp
        shell: pwsh
        run: |
          choco install winfsp -y --params '/Developer'
          # Verify WinFsp DLL is available for P/Invoke
          if (!(Test-Path "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll")) {
            Write-Error "WinFsp installation failed - DLL not found"
            exit 1
          }

      - name: Restore dependencies
        run: dotnet restore RamDrive.slnx

      - name: Build
        run: dotnet build RamDrive.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $projects = @(
            "tests/RamDrive.Core.Tests/RamDrive.Core.Tests.csproj",
            "tests/RamDrive.IntegrationTests/RamDrive.IntegrationTests.csproj"
          )
          $failed = $false
          foreach ($proj in $projects) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($proj)
            dotnet test $proj -c Release --no-build --verbosity normal `
              --logger "trx;LogFileName=$name.trx" `
              --results-directory ./TestResults `
              --collect:"XPlat Code Coverage"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Test (DifferentialChecker)
        shell: pwsh
        env:
          RAMDRIVE_DIFF: "1"
        run: |
          # Re-run integration tests with the production WinFspRamAdapter wrapped in
          # DifferentialAdapter against MemfsReferenceFs. Throws on the first
          # behavioural divergence between the two file systems. Excludes ChaosTests
          # (long random-fuzz; CI smoke covers the structured cases).
          dotnet test tests/RamDrive.IntegrationTests/RamDrive.IntegrationTests.csproj `
            -c Release --no-build --verbosity normal `
            --filter "FullyQualifiedName!~ChaosTests" `
            --logger "trx;LogFileName=RamDrive.IntegrationTests.Diff.trx" `
            --results-directory ./TestResults
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true
          use-actions-summary: 'true'
          only-summary: 'false'
          list-suites: all
          list-tests: failed

      - name: Cross-compile AOT for win-arm64
        shell: pwsh
        run: |
          # Catch ARM64-only AOT compile failures (e.g. a new package without
          # win-arm64 support, IlcInstructionSet leakage) early. We cross-publish
          # from the x64 host; runtime behaviour on ARM64 is exercised by the
          # downstream release build + the WinFsp.Native ARM64 CI leg, since
          # this repo's integration tests need a real WinFsp mount which the
          # x64 runner can't host for an arm64 binary.
          dotnet publish src/RamDrive.Cli/RamDrive.Cli.csproj `
            -c Release -r win-arm64 `
            -o ./publish-aot-arm64-ci
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Sanity: produced exe must exist.
          if (-not (Test-Path "./publish-aot-arm64-ci/RamDrive.exe")) {
            Write-Error "ARM64 cross-publish completed but RamDrive.exe is missing"
            exit 1
          }
          Write-Host "ARM64 cross-publish OK: $((Get-Item ./publish-aot-arm64-ci/RamDrive.exe).Length) bytes"

  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Write-Output "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Stage placeholder payload
        shell: pwsh
        run: |
          # ISCC only checks that each [Files] Source exists; it never executes the
          # exe or inspects its contents. So we stage zero-cost placeholders instead
          # of running the ~10-min dual-arch AOT publish. This job validates the .iss
          # structure and the [Code] Pascal syntax, not the shipped binaries.
          New-Item -ItemType Directory -Force -Path publish-aot, publish-aot-arm64 | Out-Null
          foreach ($dir in 'publish-aot', 'publish-aot-arm64') {
            Set-Content -Path "$dir/RamDrive.exe" -Value 'placeholder'
            Copy-Item src/RamDrive.Cli/appsettings.jsonc "$dir/appsettings.jsonc"
          }
          # The WinFsp MSI filename must match the WinFspMsi macro in RamDrive.iss.
          $msi = (Select-String -Path setup/RamDrive.iss -Pattern '#define\s+WinFspMsi\s+"([^"]+)"').Matches[0].Groups[1].Value
          Set-Content -Path "setup/$msi" -Value 'placeholder'
          Write-Host "Staged placeholder MSI: setup/$msi"

      - name: Compile installer (x64)
        shell: pwsh
        run: iscc.exe setup/RamDrive.iss

      - name: Compile installer (arm64)
        shell: pwsh
        run: iscc.exe /DMyAppArch=arm64 setup/RamDrive.iss

      - name: Verify installers produced
        shell: pwsh
        run: |
          $exes = Get-ChildItem installer-output/*-setup.exe
          if ($exes.Count -lt 2) {
            Write-Error "Expected x64 + arm64 installers, found $($exes.Count)"
            exit 1
          }
          $exes | ForEach-Object { Write-Host "OK: $($_.Name) ($($_.Length) bytes)" }
